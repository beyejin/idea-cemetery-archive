name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Publish to gh-pages
        shell: bash
        run: |
          set -euo pipefail

          deploy_dir="$RUNNER_TEMP/gh-pages"
          git fetch origin gh-pages
          git worktree add --detach "$deploy_dir" origin/gh-pages
          trap 'git worktree remove --force "$deploy_dir"' EXIT

          find "$deploy_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. "$deploy_dir/"
          touch "$deploy_dir/.nojekyll"

          git -C "$deploy_dir" config user.name "github-actions[bot]"
          git -C "$deploy_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$deploy_dir" add --all

          if git -C "$deploy_dir" diff --cached --quiet; then
            echo "No deployment changes."
            exit 0
          fi

          git -C "$deploy_dir" commit -m "chore: GitHub Pages 배포 갱신"
          git -C "$deploy_dir" push origin HEAD:gh-pages
